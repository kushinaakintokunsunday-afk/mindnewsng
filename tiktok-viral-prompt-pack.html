<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TikTok Viral Prompt Pack</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
<style>
:root{--a1:#fe2c55;--a2:#25f4ee;--hl:#ffe14d;--hero:#0e0f2e;--bg:#f6f6fd;--bg2:#fff;--ink:#0e0f2e;--muted:#5a5e80;--line:#e0e1f2;
--disp:"Bricolage Grotesque",system-ui,sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0b22;--bg2:#12143a;--ink:#f3f3ff;--muted:#a4a8d0;--line:#26295a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0b22;--bg2:#12143a;--ink:#f3f3ff;--muted:#a4a8d0;--line:#26295a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 var(--body);-webkit-font-smoothing:antialiased}
.w{max-width:1120px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--disp);line-height:1.03;margin:0;letter-spacing:-.035em;font-weight:800}
h2{font-size:clamp(2rem,4.8vw,3.3rem);margin-bottom:16px}
p{margin:0 0 14px}.lead{color:var(--muted);font-size:1.15rem;max-width:600px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--a1);color:#fff;font:800 1.05rem var(--disp);padding:17px 32px;border-radius:99px;text-decoration:none;box-shadow:0 12px 32px -10px var(--a1),inset 0 -3px 0 #0003;transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
:focus-visible{outline:3px solid var(--hl);outline-offset:3px}
.top{background:var(--hero);color:#fff;position:relative;overflow:hidden}
.top:before,.top:after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(110px);opacity:.38;pointer-events:none}
.top:before{background:var(--a1);top:-160px;right:-120px}.top:after{background:var(--a2);bottom:-260px;left:-160px;opacity:.22}
.top .w{position:relative;z-index:1}
.nav{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.nav b{font:800 1.2rem var(--disp)}.nav .btn{padding:10px 22px;font-size:.92rem}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;padding:48px 0 96px}
.chip{display:inline-flex;gap:8px;align-items:center;border:1px solid #ffffff33;background:#ffffff12;padding:7px 16px;border-radius:99px;font-size:.88rem;margin-bottom:24px}
.chip:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--a2)}
.hero h1{font-size:clamp(2.8rem,7.4vw,5.4rem)}
.sub{font:500 1.4rem/1.3 var(--disp);color:var(--a2);margin:20px 0 16px}
.hero .pitch{color:#c8cae8;max-width:520px;font-size:1.1rem}
.buy{display:flex;align-items:center;flex-wrap:wrap;gap:22px;margin:30px 0 16px}
.price{font:800 2.8rem var(--disp);line-height:1}.price s{font-size:1.15rem;color:#9a9dcc;margin-left:10px;font-weight:500}
.rate{display:flex;gap:10px;align-items:center;font-size:.92rem;color:#c8cae8}.rate b{color:var(--hl);letter-spacing:2px}
.phone{width:min(300px,100%);aspect-ratio:9/17.5;margin:0 auto;border-radius:42px;border:8px solid #04041a;background:linear-gradient(165deg,#2a1a6e,#12123a 55%,var(--a1) 190%);position:relative;box-shadow:0 40px 80px -20px #000,0 0 0 1px #ffffff22;display:flex;align-items:center;padding:0 56px 0 24px;overflow:hidden}
.phone:before{content:"";position:absolute;top:10px;left:50%;width:84px;height:22px;margin-left:-42px;background:#04041a;border-radius:99px}
.hk{font:800 1.75rem/1.12 var(--disp);min-height:9.5em;display:flex;align-items:center}
.hk span:after{content:"";display:inline-block;width:3px;height:1.1em;background:var(--a2);margin-left:3px;vertical-align:-.15em;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.rail{position:absolute;right:12px;bottom:96px;display:grid;gap:16px;text-align:center;font-size:.72rem}.rail i{display:block;font-style:normal;font-size:1.55rem}
.rail div:first-child i{color:var(--a1)}
.cap{position:absolute;left:20px;right:64px;bottom:24px;font-size:.8rem}.cap b{display:block}
.fl{position:absolute;background:#ffffff14;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #ffffff2e;border-radius:16px;padding:10px 16px;font-size:.85rem;font-weight:700;box-shadow:0 14px 30px -10px #0008}
.fl span{color:var(--a2)}
.proof{border-block:1px solid var(--line);background:var(--bg2)}
.proof .w{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding-block:34px}
.proof b{display:block;font:800 2.2rem var(--disp);letter-spacing:-.03em}.proof span{color:var(--muted);font-size:.95rem}
section.s{padding:96px 0}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:36px}
.vs div{border-radius:28px;padding:34px;border:1px solid var(--line);background:var(--bg2)}
.vs div:last-child{background:var(--hero);color:#fff;border-color:var(--a2);box-shadow:0 30px 60px -30px var(--a2)}
.vs h3{font-size:1.5rem;margin-bottom:16px}.vs ul{list-style:none;margin:0;padding:0}
.vs li{padding:9px 0 9px 32px;position:relative}.vs li:before{position:absolute;left:0;font-weight:800}
.vs div:first-child li{color:var(--muted)}.vs div:first-child li:before{content:"✕";color:var(--a1)}
.vs div:last-child li:before{content:"✓";color:var(--a2)}
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;margin-top:36px}
.bx{grid-column:span 2;border-radius:28px;padding:30px;background:var(--bg2);border:1px solid var(--line);min-height:230px;display:flex;flex-direction:column;justify-content:flex-end}
.bx:nth-child(4n+1),.bx:nth-child(4n){grid-column:span 4}
.bx:nth-child(4n+1){background:linear-gradient(140deg,var(--a1),#a3123a);color:#fff;border:0}
.bx:nth-child(4n){background:linear-gradient(140deg,var(--a2),#18a9b0);color:#0e0f2e;border:0}
.bx .e{font-size:2.4rem;margin-bottom:auto}.bx h3{font-size:1.55rem;margin-bottom:8px}.bx p{margin:0;opacity:.88}
.try{background:var(--hero);color:#fff}.try .lead{color:#c8cae8}
.pr{display:grid;gap:14px;margin-top:34px}
.pc{background:#ffffff0d;border:1px solid #ffffff22;border-radius:20px;padding:22px 24px;display:grid;grid-template-columns:1fr auto;gap:8px 22px;align-items:center}
.pc small{color:var(--a2);font-weight:700}.pc p{grid-column:1;margin:0;font:.97rem/1.6 ui-monospace,Menlo,Consolas,monospace;color:#e9eaff}
.copy{grid-row:1/3;grid-column:2;background:#fff;color:#0e0f2e;border:0;font-weight:800;border-radius:99px;padding:10px 20px;cursor:pointer}
.chap{display:grid;grid-template-columns:1fr 1fr;gap:0 56px;margin-top:30px}
.chap div{display:flex;gap:18px;padding:20px 0;border-bottom:1px solid var(--line)}
.chap em{font:800 2rem var(--disp);font-style:normal;color:var(--a1);min-width:42px;line-height:1.1}
.chap b{display:block;font-size:1.1rem}.chap span{color:var(--muted);font-size:.95rem}
.bon{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:34px}
.bon div{border:2px dashed var(--a1);border-radius:24px;padding:26px;background:var(--bg2)}
.bon small{background:var(--hl);color:#0e0f2e;font-weight:800;padding:3px 12px;border-radius:99px}.bon h3{font-size:1.3rem;margin:14px 0 6px}.bon p{color:var(--muted);margin:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.ticks{list-style:none;padding:0;margin:20px 0 0}.ticks li{padding:13px 0 13px 44px;position:relative;border-bottom:1px solid var(--line)}
.ticks li:before{content:"✓";position:absolute;left:0;top:12px;width:28px;height:28px;border-radius:50%;background:var(--a2);color:#0e0f2e;font-weight:800;text-align:center;line-height:28px}
.ticks.no li:before{content:"✕";background:var(--a1);color:#fff}
.q{background:var(--bg2);border:1px solid var(--line);border-radius:26px;padding:28px;margin-bottom:16px}
.q b{color:#f5b301;letter-spacing:2px}.q p{font:500 1.2rem/1.4 var(--disp);margin:8px 0}.q small{color:var(--muted)}
.price-card{max-width:560px;margin:0 auto;border-radius:36px;padding:2px;background:linear-gradient(140deg,var(--a1),var(--a2))}
.price-card>div{background:var(--hero);color:#fff;border-radius:34px;padding:44px 36px;text-align:center}
.price-card h2{color:#fff;font-size:2rem}.big{font:800 clamp(3.6rem,11vw,5.6rem) var(--disp);line-height:1;margin:14px 0 4px}.big s{font-size:.3em;color:#9a9dcc;font-weight:500;margin-left:10px}
.price-card ul{list-style:none;padding:0;margin:26px 0;text-align:left}.price-card li{padding:9px 0 9px 32px;position:relative;border-bottom:1px solid #ffffff1c}
.price-card li:before{content:"✓";position:absolute;left:0;color:var(--a2);font-weight:800}
.price-card .btn{width:100%;justify-content:center}.price-card small{display:block;margin-top:14px;color:#9a9dcc}
.guar{display:flex;gap:22px;align-items:center;max-width:760px;margin:36px auto 0;padding:26px;border:1px solid var(--line);border-radius:26px;background:var(--bg2)}
.guar i{font-style:normal;font-size:2.6rem}.guar p{margin:0;color:var(--muted)}.guar b{color:var(--ink);display:block;font:800 1.2rem var(--disp)}
details{border-bottom:1px solid var(--line);padding:20px 0;max-width:780px}
summary{font:800 1.2rem var(--disp);cursor:pointer}details p{color:var(--muted);margin:10px 0 0}
footer{text-align:center;color:var(--muted);font-size:.9rem;padding:20px 0 70px}
.stick{display:none}
@media(max-width:820px){.hero,.split,.vs,.chap{grid-template-columns:1fr}.hero{gap:44px;padding-bottom:70px}.nav .btn{display:none}
.bento{grid-template-columns:1fr}.bx,.bx:nth-child(4n+1),.bx:nth-child(4n){grid-column:auto;min-height:170px}
.pc{grid-template-columns:1fr}.copy{grid-row:auto;grid-column:1;justify-self:start}.proof b{font-size:1.5rem}.guar{flex-direction:column;text-align:center}
.fl.f2{display:none}
.stick{display:block;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.stick .btn{display:flex;justify-content:center}footer{padding-bottom:110px}section.s{padding:64px 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>

const B=BOOK,P=B.phone,rs=document.documentElement.style,G=B.guarantee;

document.getElementById("app").innerHTML=`

<div class="rail"><div><i>♥</i>${E(P.likes)}</div><div><i>💬</i>${E(P.comments)}</div><div><i>➦</i>${E(P.shares)}</div></div>

<div class="proof"><div class="w">${B.stats.map(s=>`<div><b>${E(s[0])}</b><span>${E(s[1])}</span></div>`).join("")}</div></div>
<section class="s"><div class="w"><h2>${E(B.vsTitle)}</h2><div class="vs"><div><h3>Without it</h3><ul>${li(B.without)}</ul></div><div><h3>${E(B.withTitle)}</h3><ul>${li(B.withp)}</ul></div></div></div></section>

<section class="s"><div class="w"><h2>${E(B.chaptersTitle)}</h2><div class="chap">${B.chapters.map((c,i)=>`<div><em>${i+1}</em><p style="margin:0"><b>${E(c[0])}</b><span>${E(c[1])}</span></p></div>`).join("")}</div>

document.querySelectorAll(".copy").forEach(b=>b.onclick=async()=>{const e=document.getElementById("p"+b.dataset.i);

{const el=document.getElementById("hk"),H=P.hooks;let i=0,c=0;
