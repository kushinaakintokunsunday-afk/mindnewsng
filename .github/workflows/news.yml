name: News Automation

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch-build-deploy:
    name: Fetch news, build site, deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch news feeds & build site
        run: npm run generate

      - name: IndexNow ping (Bing instant indexing)
        if: success()
        run: |
          node -e "const a=require('./data/articles.json');const key='${KEY}';const urls=a.slice(0,20).map(x=>'https://mindnewsng.com/articles/'+x.slug+'.html');const body=JSON.stringify({host:'mindnewsng.com',key:key,urlList:urls});fetch('https://api.indexnow.org/indexnow',{method:'POST',headers:{'Content-Type':'application/json; charset=utf-8'},body}).then(r=>console.log('IndexNow status:',r.status)).catch(e=>console.log('IndexNow ping failed:',e.message))"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    name: Deploy to GitHub Pages
    needs: fetch-build-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4